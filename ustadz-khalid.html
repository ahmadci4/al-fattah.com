<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Fattah - Ustadz Khalid Basalamah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #386955;
            min-height: 100vh;
            position: relative;
            padding-bottom: 90px;
        }

        .bg-ustadz {
            background-image: url('images/bg-khalid-full.jpg');
            background-size: cover;
            background-position: top center;
        }

        audio::-webkit-media-controls-enclosure {
            background-color: white;
            border-radius: 9999px;
        }

        audio::-webkit-media-controls-panel {
            background-color: white;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header & Hero Section -->
        <div class="bg-ustadz h-72 relative">
            <div class="absolute inset-0 bg-gradient-to-t from-[#386955] via-[#386955]/40 to-black/30"></div>

            <div class="absolute top-4 left-4 right-4 flex justify-between items-center text-white z-10">
                <div class="bg-black/40 backdrop-blur-sm px-2 py-1 rounded-lg flex items-center text-xs">
                    <img src="images/icon-calendar.png" class="w-4 h-4 mr-1" alt="Kalender">
                    <span id="live-date">Memuat tanggal...</span>
                </div>
                <i class="fa-regular fa-bell text-xl"></i>
            </div>

            <a href="index.html"
                class="absolute top-14 left-4 text-white z-10 bg-black/30 w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-sm">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="absolute bottom-4 left-0 w-full text-center z-10">
                <h1 class="text-[28px] leading-tight font-extrabold text-white uppercase drop-shadow-xl"
                    style="-webkit-text-stroke: 1px black;">
                    USTAD KHALID<br>BASALAMAH
                </h1>
            </div>
        </div>

        <!-- Video YouTube Embed (Bebas Error 153) -->
        <div class="px-6 mt-2 relative z-10">
            <div class="rounded-xl overflow-hidden shadow-2xl border border-white/20 bg-black">
                <iframe class="w-full aspect-video" src="https://www.youtube-nocookie.com/embed/JVP9sLy4XMQ"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- List Audio Kajian -->
        <div class="px-6 mt-8 space-y-4">

            <div class="flex items-center justify-between">
                <div class="w-[40%] text-right pr-4">
                    <span class="text-white font-bold text-[11px] uppercase tracking-wide drop-shadow-md">Solat Lima
                        Waktu</span>
                </div>
                <div class="w-[60%] bg-white rounded-full p-1 shadow-lg">
                    <audio controls class="w-full h-10 outline-none">
                        <source src="assets/khalid-solat.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="w-[40%] text-right pr-4">
                    <span class="text-white font-bold text-[11px] uppercase tracking-wide drop-shadow-md">Bakti Orang
                        Tua</span>
                </div>
                <div class="w-[60%] bg-white rounded-full p-1 shadow-lg">
                    <audio controls class="w-full h-10 outline-none">
                        <source src="assets/khalid-bakti.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="w-[40%] text-right pr-4">
                    <span class="text-white font-bold text-[11px] uppercase tracking-wide drop-shadow-md">Tauhid</span>
                </div>
                <div class="w-[60%] bg-white rounded-full p-1 shadow-lg">
                    <audio controls class="w-full h-10 outline-none">
                        <source src="assets/khalid-tauhid.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="w-[40%] text-right pr-4">
                    <span class="text-white font-bold text-[11px] uppercase tracking-wide drop-shadow-md">1 Menit
                        Emas</span>
                </div>
                <div class="w-[60%] bg-white rounded-full p-1 shadow-lg">
                    <audio controls class="w-full h-10 outline-none">
                        <source src="assets/khalid-1menit.mp3" type="audio/mpeg">
                    </audio>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div
            class="fixed bottom-0 max-w-[480px] w-full bg-[#5C8974] rounded-t-2xl flex justify-around items-end pb-3 pt-4 text-white z-50">
            <a href="index.html" class="flex flex-col items-center opacity-100">
                <i class="fa-solid fa-house text-2xl mb-1"></i><span class="text-xs">Beranda</span>
            </a>
            <a href="al-quran.html" class="flex flex-col items-center opacity-70 hover:opacity-100">
                <i class="fa-solid fa-book-open text-2xl mb-1"></i><span class="text-xs">Al-Qur'an</span>
            </a>
            <a href="pengumuman.html" class="flex flex-col items-center opacity-70 hover:opacity-100">
                <i class="fa-solid fa-bullhorn text-2xl mb-1"></i><span class="text-xs">Pengumuman</span>
            </a>
            <a href="#" class="flex flex-col items-center opacity-70 hover:opacity-100">
                <i class="fa-solid fa-mosque text-2xl mb-1"></i><span class="text-xs">Muqadimah</span>
            </a>
        </div>
    </div>

    <script>
        const dateOpts = {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'};
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('id-ID', dateOpts);
    </script>
</body>

</html>
