<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Fattah - Tadarus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #3B7258; min-height: 100vh; position: relative; padding-bottom: 90px; }
        .bg-tadarus-header { background-image: url('images/bg-tadarus.jpg'); background-size: cover; background-position: top; }
        .audio-player::-webkit-media-controls-panel { background-color: #f3f4f6; border-radius: 9999px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="bg-tadarus-header h-64 relative rounded-b-[30px] shadow-lg">
            <div class="absolute inset-0 bg-gradient-to-t from-[#3B7258] via-transparent to-black/40 rounded-b-[30px]"></div>
            
            <div class="absolute top-4 left-4 right-4 flex justify-between items-center text-white">
                <div class="bg-black/40 backdrop-blur-sm px-2 py-1 rounded-lg flex items-center text-xs">
                    <img src="images/icon-calendar.png" class="w-4 h-4 mr-1" alt="Kalender">
                    <span id="live-date">Selasa, 30 Jumadilawal...</span>
                </div>
                <i class="fa-regular fa-bell text-xl"></i>
            </div>

            <div class="absolute inset-0 flex items-center justify-center mt-10">
                <h1 class="text-4xl font-bold text-white tracking-widest" style="-webkit-text-stroke: 1px black;">TADARUS</h1>
            </div>
        </div>

        <!-- Tadarus Tracker UI -->
        <div class="px-6 -mt-8 relative z-10">
            <div class="bg-white rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-[#3B7258] font-bold text-lg">Estafet Bacaan</h2>
                    <span class="bg-green-100 text-green-800 text-[10px] font-bold px-2 py-1 rounded-full">Juz 1</span>
                </div>

                <!-- History Bacaan (Selesai) -->
                <div class="mb-4">
                    <div class="flex items-start mb-3">
                        <div class="bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center text-[#3B7258] font-bold mr-3 shrink-0">1</div>
                        <div class="w-full">
                            <p class="text-xs text-gray-500 font-medium">Telah dibaca oleh</p>
                            <p class="text-sm font-bold text-gray-800">Bapak Azmi</p>
                            <p class="text-xs text-gray-600 mb-2">Surah Al-Fatihah: 1-7 & Al-Baqarah: 1-5</p>
                            <!-- Audio Player (Voice Note) -->
                            <audio controls class="audio-player w-full h-8">
                                <source src="assets/rekaman-1.mp3" type="audio/mpeg">
                            </audio>
                        </div>
                    </div>
                </div>

                <!-- Status Sedang Dibaca -->
                <div class="mb-4 bg-yellow-50 p-3 rounded-lg border border-yellow-200">
                    <div class="flex items-start">
                        <div class="bg-yellow-400 rounded-full w-8 h-8 flex items-center justify-center text-white font-bold mr-3 shrink-0"><i class="fa-solid fa-microphone-lines"></i></div>
                        <div class="w-full">
                            <p class="text-xs text-yellow-600 font-medium animate-pulse">Sedang dilanjutkan oleh...</p>
                            <p class="text-sm font-bold text-gray-800">Irham</p>
                            <p class="text-xs text-gray-600">Surah Al-Baqarah: 6-16</p>
                        </div>
                    </div>
                </div>

                <!-- Tombol Sambung -->
                <button class="w-full bg-[#3B7258] text-white font-bold py-2.5 rounded-full shadow hover:bg-[#2A4B3C] transition text-sm flex items-center justify-center">
                    <i class="fa-solid fa-plus mr-2"></i> Sambung Bacaan Berikutnya
                </button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 max-w-[480px] w-full bg-[#5C8974] rounded-t-2xl flex justify-around items-end pb-3 pt-4 text-white z-50">
            <a href="index.html" class="flex flex-col items-center opacity-70 hover:opacity-100">
                <i class="fa-solid fa-house text-2xl mb-1"></i><span class="text-xs">Beranda</span>
            </a>
            <a href="al-quran.html" class="flex flex-col items-center opacity-70 hover:opacity-100">
                <i class="fa-solid fa-book-open text-2xl mb-1"></i><span class="text-xs">Al-Qur'an</span>
            </a>
            </a>
            <a href="#" class="flex flex-col items-center opacity-70 hover:opacity-100">
                <i class="fa-solid fa-bullhorn text-2xl mb-1"></i><span class="text-xs">Pengumuman</span>
            </a>
            <a href="#" class="flex flex-col items-center opacity-70 hover:opacity-100">
                <i class="fa-solid fa-mosque text-2xl mb-1"></i><span class="text-xs">Muqadimah</span>
            </a>
        </div>
    </div>
    <script>
        // Set tanggal hari ini sederhana (sebagai pelengkap UI)
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('id-ID', dateOptions);
    </script>
</body>
</html>
